name: Release npm packages

# A release contains one JavaScript plugin package plus six platform-selective
# native packages. The editor wasm/CanvasKit payload is built once from the
# pinned OpenPencil submodule, then copied beside each platform daemon.
#
# npm authentication boundaries:
# 1. Trusted publishing (OIDC), enabled by id-token: write, covers every new
#    npm publish operation.
# 2. NPM_TOKEN is optional for a normal release, but is required to repair a
#    missing or older dist-tag on an already-published matching version. The
#    publish preflight rejects that recovery plan before any mutation when the
#    token is absent.
#
# scripts/publish-release.mjs owns the multi-package invariants: native
# packages publish before the root, an already-published matching tarball is
# skipped (but different integrity fails), and prereleases use the next tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Existing synchronized package version (for example 0.1.0-rc.2)
        required: true
        type: string
      publish:
        description: Publish after every build and selective-install check passes
        required: true
        default: false
        type: boolean

concurrency:
  # npm dist-tags are shared mutable state across versions, so releases must
  # serialize globally rather than only against another run of the same tag.
  group: dsh-openpencil-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24.11.0'
  RUST_VERSION: '1.94'
  BINARYEN_VERSION: version_123

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      matrix: ${{ steps.release.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Select and validate the release version
        id: release
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION#v}"
          node scripts/check-release-version.mjs "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          node -e "const config=require('./platforms.json'); process.stdout.write('matrix='+JSON.stringify({include:config.platforms})+'\\n')" >> "$GITHUB_OUTPUT"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm run build

      - name: Validate all package metadata
        run: node scripts/verify-platform-packages.mjs

  build-web-once:
    name: Build pinned editor and viewer web assets once
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-15
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: vendor/openpencil -> target
          shared-key: dsh-openpencil-web-release

      - name: Install wasm-bindgen-cli matching the pinned OpenPencil lockfile
        working-directory: vendor/openpencil
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^name = "wasm-bindgen"$/{found=1; next} found && /^version = /{gsub(/[" ]/,"",$3); print $3; exit}' Cargo.lock)"
          if [ -z "$version" ]; then
            echo "::error::could not resolve wasm-bindgen version from Cargo.lock"
            exit 1
          fi
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Install pinned binaryen
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar -xz
          echo "${GITHUB_WORKSPACE}/binaryen-${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
          "${GITHUB_WORKSPACE}/binaryen-${BINARYEN_VERSION}/bin/wasm-opt" --version

      - name: Build and gate the packaged editor web bundle
        working-directory: vendor/openpencil
        run: bash tools/check-wasm-bundle.sh

      - name: Build and gate the read-only viewer web bundle
        working-directory: vendor/openpencil
        run: bash crates/op-web-sdk/tools/build-wasm.sh

      - name: Test collaboration document and transport queues
        run: >-
          cargo test
          --manifest-path vendor/openpencil/Cargo.toml
          --locked
          -p op-collab-host
          -p op-collab-transport

      - name: Smoke two-process document convergence
        run: >-
          cargo run
          --manifest-path vendor/openpencil/Cargo.toml
          --locked
          -p op-collab-smoke
          --features test-issuer
          -- run

      - name: Sync viewer assets
        run: pnpm run sync:viewer-assets

      - name: Build and test the plugin against generated viewer assets
        run: |
          pnpm run build
          pnpm run test:viewer-assets
          pnpm run test:client
          pnpm run test:host-api
          pnpm run test:mcp

      # Match OpenPencil's platform VSIX layout: only the served pkg and
      # CanvasKit runtime are transferred to the six native jobs.
      - name: Assemble editor web artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web-artifact/pkg web-artifact/canvaskit
          cp -R vendor/openpencil/crates/op-host-web/pkg/. web-artifact/pkg/
          cp -R vendor/openpencil/crates/op-host-web/assets/canvaskit/. web-artifact/canvaskit/
          rm -f web-artifact/pkg/*.opt.wasm web-artifact/pkg/*.d.ts
          test -f web-artifact/pkg/op_host_web.js
          test -f web-artifact/pkg/op_host_web_bg.wasm
          test -f web-artifact/canvaskit/canvaskit.js
          test -f web-artifact/canvaskit/canvaskit.wasm
          test -d web-artifact/pkg/assets

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: editor-web
          path: web-artifact
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: viewer-assets
          path: lib/viewer-assets
          if-no-files-found: error
          retention-days: 7

  build-native:
    name: Build ${{ matrix.id }} runtime package
    needs: [validate, build-web-once]
    environment: release-production
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    # The catalog pins native runners so every staged daemon is executed on
    # its own architecture. GitHub currently has no Ubuntu 22.04 ARM64 hosted
    # runner, so linux-arm64 deliberately uses 24.04; its glibc compatibility
    # floor must be treated separately from linux-x64's Ubuntu 22.04 build.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-15
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.rustTarget }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: vendor/openpencil -> target
          key: dsh-openpencil-${{ matrix.rustTarget }}

      - name: Install Linux headless server dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libfreetype-dev libfontconfig1-dev fonts-noto-cjk

      - name: Build collaboration-enabled op-host-web-server
        env:
          OPENPENCIL_BUILD_COLLAB_BOOTSTRAP_URL_CN: ${{ secrets.OPENPENCIL_BUILD_COLLAB_BOOTSTRAP_URL_CN }}
          OPENPENCIL_BUILD_COLLAB_BOOTSTRAP_URL_GLOBAL: ${{ secrets.OPENPENCIL_BUILD_COLLAB_BOOTSTRAP_URL_GLOBAL }}
        run: node scripts/build-editor-runtime.mjs --target ${{ matrix.rustTarget }}

      - name: Verify production collaboration auth ABI
        shell: bash
        env:
          OP_AUTH_CARGO_TARGET: ${{ matrix.rustTarget }}
        run: bash vendor/openpencil/tools/check-op-auth-cargo-build.sh

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: editor-web
          path: web-artifact

      - name: Stage the complete packaged editor runtime
        run: >-
          node scripts/stage-editor-runtime.mjs
          --platform ${{ matrix.id }}
          --binary vendor/openpencil/target/${{ matrix.rustTarget }}/release/${{ matrix.binaryName }}
          --pkg web-artifact/pkg
          --canvaskit web-artifact/canvaskit

      - name: Build plugin against the packaged runtime
        run: pnpm run build

      - name: Verify and smoke the real packaged daemon
        env:
          OPENPENCIL_BUILD_COLLAB_BOOTSTRAP_URL_CN: ${{ secrets.OPENPENCIL_BUILD_COLLAB_BOOTSTRAP_URL_CN }}
          OPENPENCIL_BUILD_COLLAB_BOOTSTRAP_URL_GLOBAL: ${{ secrets.OPENPENCIL_BUILD_COLLAB_BOOTSTRAP_URL_GLOBAL }}
        run: node scripts/verify-platform-packages.mjs --platform ${{ matrix.id }} --require-runtime --require-collab-bootstrap

      - name: Pack native package
        run: node scripts/pack-package.mjs --package ./npm/${{ matrix.id }} --destination artifacts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  pack-root:
    name: Pack root plugin package
    needs: [validate, build-web-once]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: viewer-assets
          path: lib/viewer-assets

      - name: Build and verify root package
        run: |
          pnpm run build
          pnpm run test:viewer-assets
          node scripts/verify-platform-packages.mjs

      - name: Pack root package
        run: node scripts/pack-package.mjs --package . --destination artifacts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-root
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  verify-pack-set:
    name: Verify npm selects exactly one native runtime
    needs: [validate, build-native, pack-root]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Use npm 11 platform override support
        run: npm install --global npm@11

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: artifacts

      - name: Simulate all six selective installs
        run: node scripts/verify-selective-install.mjs artifacts

  publish:
    name: Publish native packages first and root last
    needs: [validate, verify-pack-set]
    if: github.event_name == 'push' || inputs.publish == true
    runs-on: ubuntu-22.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Use npm 11 trusted publishing support
        run: npm install --global npm@11

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: artifacts

      - name: Publish with idempotency and prerelease dist-tag guards
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-release.mjs artifacts
